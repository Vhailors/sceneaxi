name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - run: pnpm install --frozen-lockfile
        working-directory: sites/umbrella
      - run: pnpm test:provider
        working-directory: sites/umbrella
      - run: pnpm typecheck
        working-directory: sites/umbrella
