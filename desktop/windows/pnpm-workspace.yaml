packages:
  - "."
# Postinstall approvals, so install stays non-interactive locally and in CI:
# electron downloads its runtime binary, esbuild links its native binary,
# electron-winstaller is Windows packaging support pulled in by electron-builder.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
# pnpm 12 reads overrides here, not the legacy package.json pnpm field.
# Keep the independently frozen Windows lockfile's reviewed pins unchanged.
overrides:
  js-yaml@4: 4.3.2
  fast-uri@3: 3.1.8
  brace-expansion@5: 5.0.12
  brace-expansion@2: 2.1.7
  brace-expansion@1: 1.1.21
  postcss@8: 8.5.23
  nanoid@3: 3.3.18
