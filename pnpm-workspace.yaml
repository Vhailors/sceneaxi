
# Linked site sources must not expose a nested pnpm symlink graph to Next traces.
# This changes install layout only; frameworks remain outside this workspace.
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  unrs-resolver: true
overrides:
  fast-uri@3: 3.1.8
  brace-expansion@5: 5.0.12
  brace-expansion@2: 2.1.7
  brace-expansion@1: 1.1.21
  postcss@8: 8.5.23
  nanoid@3: 3.3.18
  sharp@<0.35.5: 0.35.5
# Keep membership last: existing publish-safety injection fixtures append here.
packages:
  - packages/*
  - apps/*
